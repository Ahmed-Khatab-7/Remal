services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: remal-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Remal@StrongPass2026}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - remal_sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: remal-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=RemalDb;User Id=sa;Password=${SA_PASSWORD:-Remal@StrongPass2026};TrustServerCertificate=True;Encrypt=False;"
      Jwt__Issuer: "Remal.Api"
      Jwt__Audience: "Remal.Client"
      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      Jwt__AccessTokenExpiryMinutes: "60"
      Jwt__RefreshTokenExpiryDays: "14"
      Cors__AllowedOrigins__0: "${FRONTEND_URL:-http://localhost:5173}"
      Cors__AllowedOrigins__1: "https://remal.eg"
      Cors__AllowedOrigins__2: "https://admin.remal.eg"
      Paymob__ApiKey: "${PAYMOB_API_KEY:-}"
      Paymob__IframeId: "${PAYMOB_IFRAME_ID:-}"
      Paymob__IntegrationId: "${PAYMOB_INTEGRATION_ID:-}"
      Paymob__HmacSecret: "${PAYMOB_HMAC_SECRET:-}"
      Seed__DefaultPartnerPassword: "${SEED_PARTNER_PASSWORD:-Remal@2026}"
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - remal_logs:/app/logs
    restart: unless-stopped

volumes:
  remal_sql_data:
  remal_logs:
